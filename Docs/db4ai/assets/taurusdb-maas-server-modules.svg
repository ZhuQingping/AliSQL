<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="990" viewBox="0 0 1000 990" role="img" aria-labelledby="title desc">
  <title id="title">TaurusDB MaaS server module boundaries</title><desc id="desc">Control plane and data plane modules with their permitted interactions.</desc>
  <defs><style>.h{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#102A43}.t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#243B53}.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#627D98}.k{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#FFFFFF}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2563EB"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0F766E"/></marker></defs>
  <rect width="1000" height="990" fill="#F8FAFC"/><text x="70" y="73" class="h" font-size="31" font-weight="700">mysqld 内部模块边界</text><text x="70" y="105" class="s" font-size="16">控制面只发布安全的模型配置；数据面只执行一次受控调用。</text>
  <rect x="56" y="145" width="888" height="284" rx="22" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/><text x="86" y="185" class="t" font-size="18" font-weight="700">Data plane · 每次 SQL 调用</text>
  <g><rect x="90" y="220" width="186" height="110" rx="14" fill="#2563EB"/><text x="183" y="260" text-anchor="middle" class="k" font-size="18" font-weight="700">SQL 函数层</text><text x="183" y="287" text-anchor="middle" class="k" font-size="14">参数 · 类型 · 权限入口</text></g>
  <g><rect x="405" y="205" width="208" height="140" rx="14" fill="#1D4ED8"/><text x="509" y="249" text-anchor="middle" class="k" font-size="19" font-weight="700">AI Runtime</text><text x="509" y="277" text-anchor="middle" class="k" font-size="14">Profile 快照 · 审计编排</text><text x="509" y="300" text-anchor="middle" class="k" font-size="14">本地失败边界</text></g>
  <g><rect x="744" y="220" width="164" height="110" rx="14" fill="#0F766E"/><text x="826" y="260" text-anchor="middle" class="k" font-size="18" font-weight="700">Adapter</text><text x="826" y="287" text-anchor="middle" class="k" font-size="14">Huawei JSON · libcurl</text></g>
  <path d="M276 275 H405" stroke="#2563EB" stroke-width="4" marker-end="url(#a)"/><path d="M613 275 H744" stroke="#0F766E" stroke-width="4" marker-end="url(#g)"/>
  <g><rect x="98" y="365" width="220" height="42" rx="10" fill="#FFFFFF" stroke="#93C5FD"/><text x="208" y="392" text-anchor="middle" class="t" font-size="14">AI_INVOKE / AI_ADMIN</text><rect x="387" y="365" width="240" height="42" rx="10" fill="#FFFFFF" stroke="#93C5FD"/><text x="507" y="392" text-anchor="middle" class="t" font-size="14">File audit: STARTED → terminal</text><rect x="696" y="365" width="182" height="42" rx="10" fill="#FFFFFF" stroke="#93C5FD"/><text x="787" y="392" text-anchor="middle" class="t" font-size="14">1 MiB response limit</text></g>
  <rect x="56" y="470" width="888" height="262" rx="22" fill="#ECFDF5" stroke="#99F6E4" stroke-width="2"/><text x="86" y="510" class="t" font-size="18" font-weight="700">Control plane · 管理员低频变更</text>
  <g><rect x="95" y="550" width="206" height="112" rx="14" fill="#0F766E"/><text x="198" y="593" text-anchor="middle" class="k" font-size="19" font-weight="700">dbms_ai</text><text x="198" y="620" text-anchor="middle" class="k" font-size="14">注册 · 更新 · 删除 · 展示</text></g>
  <g><rect x="399" y="535" width="224" height="142" rx="14" fill="#047857"/><text x="511" y="578" text-anchor="middle" class="k" font-size="19" font-weight="700">Model Registry</text><text x="511" y="606" text-anchor="middle" class="k" font-size="14">配置版本 · 能力 · 固定端点</text><text x="511" y="630" text-anchor="middle" class="k" font-size="14">凭据模式/引用</text></g>
  <g><rect x="717" y="550" width="186" height="112" rx="14" fill="#0F766E"/><text x="810" y="593" text-anchor="middle" class="k" font-size="19" font-weight="700">凭据解析</text><text x="810" y="620" text-anchor="middle" class="k" font-size="14">SECRET_REF / Debug</text></g>
  <path d="M301 606 H399" stroke="#0F766E" stroke-width="4" marker-end="url(#g)"/><path d="M623 606 H717" stroke="#0F766E" stroke-width="4" marker-end="url(#g)"/>
  <path d="M510 535 V435" stroke="#0F766E" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#g)"/><text x="530" y="483" class="s" font-size="14">调用时解析配置快照</text>
  <rect x="56" y="775" width="888" height="150" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="86" y="816" class="h" font-size="18" font-weight="700">边界：客户 SQL 不可越过</text><text x="86" y="853" class="t" font-size="16">不能传 Endpoint、API Key、Provider 原始 JSON 或 tool 调用；无法直接写模型控制表。</text><text x="86" y="885" class="t" font-size="16">RAG 检索与访问控制留在 SQL；模型只接收 prompt 中已筛选、已脱敏的资料。</text>
</svg>
