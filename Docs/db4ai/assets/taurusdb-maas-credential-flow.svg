<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t d"><title id="t">Credential resolution flow</title><desc id="d">Administrator publishes model profile and runtime resolves a secret for a single request.</desc><defs><style>.h{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#102A43}.t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#243B53}.k{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#0F766E"/></marker></defs><rect width="1000" height="470" fill="#F8FAFC"/><text x="64" y="66" class="h" font-size="29" font-weight="700">凭据解析：配置与调用严格分离</text><text x="64" y="96" class="t" font-size="16">密钥从不进入业务 SQL、模型输出、审计或错误文本。</text><g><rect x="65" y="160" width="170" height="100" rx="16" fill="#0F766E"/><text x="150" y="202" text-anchor="middle" class="k" font-size="18" font-weight="700">AI_ADMIN</text><text x="150" y="228" text-anchor="middle" class="k" font-size="14">dbms_ai 发布配置</text></g><g><rect x="325" y="145" width="210" height="130" rx="16" fill="#047857"/><text x="430" y="188" text-anchor="middle" class="k" font-size="18" font-weight="700">Model Profile</text><text x="430" y="215" text-anchor="middle" class="k" font-size="14">credential_mode + reference</text><text x="430" y="239" text-anchor="middle" class="k" font-size="14">版本化、固定 Endpoint</text></g><g><rect x="625" y="145" width="160" height="130" rx="16" fill="#2563EB"/><text x="705" y="188" text-anchor="middle" class="k" font-size="18" font-weight="700">Runtime</text><text x="705" y="215" text-anchor="middle" class="k" font-size="14">单次调用解析</text><text x="705" y="239" text-anchor="middle" class="k" font-size="14">短生命周期内存</text></g><g><rect x="835" y="120" width="120" height="75" rx="14" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="895" y="151" text-anchor="middle" class="t" font-size="15" font-weight="700">SECRET_REF</text><text x="895" y="175" text-anchor="middle" class="t" font-size="13">keyring / CSMS</text></g><g><rect x="835" y="225" width="120" height="75" rx="14" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2"/><text x="895" y="256" text-anchor="middle" class="t" font-size="15" font-weight="700">Debug only</text><text x="895" y="280" text-anchor="middle" class="t" font-size="13">PLAINTEXT_DEV</text></g><path d="M235 210H325" stroke="#0F766E" stroke-width="4" marker-end="url(#a)"/><path d="M535 210H625" stroke="#0F766E" stroke-width="4" marker-end="url(#a)"/><path d="M785 187H835" stroke="#0F766E" stroke-width="4" marker-end="url(#a)"/><path d="M785 232H835" stroke="#F59E0B" stroke-width="4" marker-end="url(#a)"/><rect x="65" y="350" width="890" height="64" rx="15" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="92" y="390" class="t" font-size="16">Release 仅允许 SECRET_REF；凭据不可读时在 MaaS 出站前失败。Debug 明文仅供临时联调，随后删除配置并轮换 Key。</text></svg>
