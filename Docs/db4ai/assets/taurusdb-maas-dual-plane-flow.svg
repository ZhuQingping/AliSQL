<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1760" viewBox="0 0 1000 1760" role="img" aria-labelledby="title desc">
  <title id="title">TaurusDB 对接 MaaS 的调用执行与模型治理双主线</title>
  <desc id="desc">竖版流程图。上半部分为 AI_EMBEDDING 和 AI_ANALYZE 调用执行主线，右侧审计框由两条带编号虚线明确创建与收尾时点。下半部分为模型管理与用户授权治理主线。</desc>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#2563eb"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#15803d"/></marker>
    <marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#c2410c"/></marker>
    <style>
      .font{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}
      .sub{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#475569}
      .title{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;font-weight:700;fill:#0f172a}
      .box{stroke-width:2;rx:14;ry:14}.exec{fill:#eff6ff;stroke:#2563eb}.gov{fill:#f0fdf4;stroke:#15803d}.audit{fill:#fff7ed;stroke:#ea580c}.cloud{fill:#f8fafc;stroke:#475569}
      .blue{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#blue)}
      .green{stroke:#15803d;stroke-width:3;fill:none;marker-end:url(#green)}
      .orange{stroke:#c2410c;stroke-width:2.6;fill:none;stroke-dasharray:8 6;marker-end:url(#orange)}
      .greenDash{stroke:#15803d;stroke-width:2.6;fill:none;stroke-dasharray:8 6;marker-end:url(#green)}
    </style>
  </defs>

  <rect width="1000" height="1760" fill="#ffffff"/>
  <text x="500" y="46" text-anchor="middle" class="title" font-size="28">TaurusDB 对接 MaaS：调用执行与模型治理双主线</text>

  <!-- Data plane -->
  <rect x="35" y="75" width="930" height="940" rx="18" fill="#f8fbff" stroke="#93c5fd" stroke-width="2"/>
  <text x="70" y="116" class="title" font-size="24">A. 调用执行主线（Data Plane）</text>
  <text x="70" y="145" class="sub" font-size="16">一次 AI_EMBEDDING() 或 AI_ANALYZE() 的实时调用；蓝线为请求主路径。</text>

  <rect class="box exec" x="130" y="180" width="420" height="78"/>
  <text x="340" y="213" text-anchor="middle" class="font" font-size="20" font-weight="700">客户 SQL / 应用</text>
  <text x="340" y="239" text-anchor="middle" class="sub" font-size="15">AI_EMBEDDING() / AI_ANALYZE()</text>

  <rect class="box exec" x="130" y="300" width="420" height="78"/>
  <text x="340" y="333" text-anchor="middle" class="font" font-size="20" font-weight="700">AI 执行运行时</text>
  <text x="340" y="359" text-anchor="middle" class="sub" font-size="15">SQL 契约、参数校验、统一错误码</text>

  <rect class="box exec" x="130" y="420" width="420" height="78"/>
  <text x="340" y="453" text-anchor="middle" class="font" font-size="20" font-weight="700">身份与权限校验</text>
  <text x="340" y="479" text-anchor="middle" class="sub" font-size="15">有效 user@host → model + capability</text>

  <rect class="box exec" x="130" y="540" width="420" height="92"/>
  <text x="340" y="574" text-anchor="middle" class="font" font-size="20" font-weight="700">解析已发布模型配置</text>
  <text x="340" y="600" text-anchor="middle" class="sub" font-size="15">模型、Endpoint、凭据、config_version</text>

  <rect class="box exec" x="130" y="690" width="420" height="92"/>
  <text x="340" y="724" text-anchor="middle" class="font" font-size="20" font-weight="700">能力、Adapter 与网络传输</text>
  <text x="340" y="750" text-anchor="middle" class="sub" font-size="15">Embedding / Analyze · HTTP/TLS · 受控出口</text>

  <rect class="box cloud" x="130" y="840" width="420" height="78"/>
  <text x="340" y="873" text-anchor="middle" class="font" font-size="20" font-weight="700">云端模型服务</text>
  <text x="340" y="899" text-anchor="middle" class="sub" font-size="15">华为云 MaaS / 阿里云百炼 / 火山方舟</text>

  <path class="blue" d="M340 258 V300"/><path class="blue" d="M340 378 V420"/><path class="blue" d="M340 498 V540"/><path class="blue" d="M340 632 V690"/><path class="blue" d="M340 782 V840"/>
  <text x="358" y="822" class="sub" font-size="14">HTTPS 请求</text>

  <!-- Explicit audit fan-out -->
  <rect class="box audit" x="630" y="540" width="295" height="194"/>
  <text x="777" y="576" text-anchor="middle" class="font" font-size="19" font-weight="700">审计、计量与治理</text>
  <text x="777" y="610" text-anchor="middle" class="sub" font-size="14">① STARTED：配置解析后、出站前</text>
  <text x="777" y="638" text-anchor="middle" class="sub" font-size="14">② 收尾：Provider 响应、失败或超时后</text>
  <line x1="653" y1="657" x2="902" y2="657" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="777" y="683" text-anchor="middle" class="sub" font-size="14">call_id、用户、模型、版本、状态</text>
  <text x="777" y="707" text-anchor="middle" class="sub" font-size="14">时延、用量、错误码（敏感内容脱敏）</text>

  <path class="orange" d="M550 586 H630"/>
  <text x="560" y="578" class="sub" font-size="16">①</text>

  <path class="orange" d="M550 736 H590 V704 H630"/>
  <text x="560" y="757" class="sub" font-size="16">②</text>

  <path d="M550 879 H600 V805 H550 V782" stroke="#475569" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#blue)"/>
  <text x="607" y="811" class="sub" font-size="14">响应返回</text>

  <text x="500" y="970" text-anchor="middle" class="sub" font-size="15">凭据仅供内部 Transport 使用；配置变更不会影响已经开始并绑定 config_version 的调用。</text>

  <!-- Control plane -->
  <rect x="35" y="1050" width="930" height="650" rx="18" fill="#f7fdf8" stroke="#86efac" stroke-width="2"/>
  <text x="70" y="1091" class="title" font-size="24">B. 模型治理主线（Control Plane）</text>
  <text x="70" y="1120" class="sub" font-size="16">受控 DBA/平台操作。绿线为管理发布路径，影响后续新调用。</text>

  <rect class="box gov" x="130" y="1155" width="420" height="78"/>
  <text x="340" y="1188" text-anchor="middle" class="font" font-size="20" font-weight="700">DBA / 平台管理员</text>
  <text x="340" y="1214" text-anchor="middle" class="sub" font-size="15">受控 AI 管理接口</text>

  <rect class="box gov" x="130" y="1270" width="420" height="92"/>
  <text x="340" y="1304" text-anchor="middle" class="font" font-size="20" font-weight="700">模型生命周期管理</text>
  <text x="340" y="1330" text-anchor="middle" class="sub" font-size="15">新增、更新、启用、停用、下线</text>

  <rect class="box gov" x="130" y="1400" width="420" height="92"/>
  <text x="340" y="1434" text-anchor="middle" class="font" font-size="20" font-weight="700">模型授权管理</text>
  <text x="340" y="1460" text-anchor="middle" class="sub" font-size="15">GRANT / REVOKE：user@host → model + capability</text>

  <rect class="box gov" x="130" y="1530" width="420" height="92"/>
  <text x="340" y="1564" text-anchor="middle" class="font" font-size="20" font-weight="700">校验、发布与运行时刷新</text>
  <text x="340" y="1590" text-anchor="middle" class="sub" font-size="15">凭据/协议/连通性/维度校验，原子切换 config_version</text>

  <path class="green" d="M340 1233 V1270"/><path class="green" d="M340 1362 V1400"/><path class="green" d="M340 1492 V1530"/>
  <text x="360" y="1517" class="sub" font-size="14">授权可独立执行</text>

  <path class="greenDash" d="M550 1576 H940 V510 H590 V586 H550"/>
  <text x="675" y="1549" class="sub" font-size="14">发布后刷新注册表</text>
  <text x="700" y="1015" class="sub" font-size="14">后续新调用读取已发布配置</text>

  <text x="500" y="1672" text-anchor="middle" class="sub" font-size="15">横切保障：可靠性、可观测性与测试验证覆盖两条主线；向量与 RAG 数据契约承接 Embedding 输出。</text>
</svg>
