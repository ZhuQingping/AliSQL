<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1660" viewBox="0 0 1000 1660" role="img" aria-labelledby="title desc">
  <title id="title">AI_ANALYZE 端到端调用流程</title>
  <desc id="desc">竖版时序流程图，展示从 SQL 到审计、凭据、MaaS、响应和终态审计的关键失败边界。</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EFF6FF"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#1E3A5F" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2563EB"/></marker>
    <style>.h{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#102A43}.t{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#486581}.s{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#627D98}.w{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}.n{font-family:-apple-system,BlinkMacSystemFont,sans-serif;fill:#fff;font-weight:700}</style>
  </defs>
  <rect width="1000" height="1660" fill="#F8FAFC"/>
  <rect x="0" y="0" width="1000" height="156" fill="url(#top)"/>
  <text x="70" y="74" class="h" font-size="31" font-weight="700">AI_ANALYZE() · 一次受控模型调用</text>
  <text x="70" y="110" class="t" font-size="17">新 SQL 契约：model_name + prompt + 可选的 max_output_tokens / timeout_ms</text>
  <text x="70" y="136" class="s" font-size="14">蓝色为主路径；红色为本地 fail-closed；绿色为安全的响应回流</text>

  <rect x="70" y="190" width="860" height="1130" rx="28" fill="#fff" stroke="#D9E2EC" stroke-width="1.5" filter="url(#shadow)"/>
  <line x1="210" y1="268" x2="210" y2="1266" stroke="#D9E2EC" stroke-width="2" stroke-dasharray="6 8"/>
  <line x1="430" y1="268" x2="430" y2="1266" stroke="#D9E2EC" stroke-width="2" stroke-dasharray="6 8"/>
  <line x1="650" y1="268" x2="650" y2="1266" stroke="#D9E2EC" stroke-width="2" stroke-dasharray="6 8"/>
  <line x1="830" y1="268" x2="830" y2="1266" stroke="#D9E2EC" stroke-width="2" stroke-dasharray="6 8"/>
  <g font-size="16" font-weight="700"><text x="210" y="240" text-anchor="middle" class="h">Client</text><text x="430" y="240" text-anchor="middle" class="h">mysqld</text><text x="650" y="240" text-anchor="middle" class="h">Audit / Credential</text><text x="830" y="240" text-anchor="middle" class="h">Huawei MaaS</text></g>

  <g><circle cx="112" cy="318" r="17" fill="#2563EB"/><text x="112" y="324" text-anchor="middle" class="n" font-size="14">1</text><text x="145" y="324" class="t" font-size="16">SELECT AI_ANALYZE(model, prompt [, options])</text><path d="M210 344 H430" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/></g>
  <rect x="272" y="370" width="316" height="75" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/><text x="430" y="401" text-anchor="middle" class="h" font-size="16" font-weight="700">参数、AI_INVOKE、options 校验</text><text x="430" y="426" text-anchor="middle" class="s" font-size="13">空值 / 未知 option / 越界均在出站前拒绝</text>
  <path d="M430 445 V490" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="272" y="504" width="316" height="75" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/><text x="430" y="535" text-anchor="middle" class="h" font-size="16" font-weight="700">解析 TEXT_GENERATION Profile</text><text x="430" y="560" text-anchor="middle" class="s" font-size="13">模型、能力、服务端固定 Endpoint、配置版本</text>
  <path d="M430 579 H650" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
  <g><circle cx="112" cy="604" r="17" fill="#2563EB"/><text x="112" y="610" text-anchor="middle" class="n" font-size="14">2</text><text x="145" y="610" class="t" font-size="15">审计 ON：先落 STARTED</text></g>
  <rect x="528" y="626" width="244" height="74" rx="14" fill="#F0FDFA" stroke="#99F6E4"/><text x="650" y="656" text-anchor="middle" class="h" font-size="16" font-weight="700">AI_CALL_STARTED</text><text x="650" y="682" text-anchor="middle" class="s" font-size="13">fsync 失败 → 不发送 MaaS 请求</text>
  <path d="M650 700 V747 H430" stroke="#2563EB" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="272" y="762" width="316" height="74" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/><text x="430" y="792" text-anchor="middle" class="h" font-size="16" font-weight="700">读取 credential，构造 HTTPS 请求</text><text x="430" y="817" text-anchor="middle" class="s" font-size="13">Authorization 仅在本次调用内存中存在</text>
  <path d="M430 836 H830" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
  <g><circle cx="112" cy="861" r="17" fill="#2563EB"/><text x="112" y="867" text-anchor="middle" class="n" font-size="14">3</text><text x="145" y="867" class="t" font-size="15">libcurl POST，经 Policy Route / NAT / EIP</text></g>
  <rect x="705" y="886" width="190" height="74" rx="14" fill="#F0FDFA" stroke="#99F6E4"/><text x="800" y="916" text-anchor="middle" class="h" font-size="16" font-weight="700">模型推理</text><text x="800" y="942" text-anchor="middle" class="s" font-size="13">Chat response + usage</text>
  <path d="M830 960 H430" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/>
  <g><circle cx="112" cy="985" r="17" fill="#059669"/><text x="112" y="991" text-anchor="middle" class="n" font-size="14">4</text><text x="145" y="991" class="t" font-size="15">HTTPS 响应沿同一连接回流</text></g>
  <rect x="272" y="1010" width="316" height="74" rx="14" fill="#ECFDF5" stroke="#A7F3D0"/><text x="430" y="1040" text-anchor="middle" class="h" font-size="16" font-weight="700">Adapter 校验并提取最终文本</text><text x="430" y="1066" text-anchor="middle" class="s" font-size="13">非 2xx、超时、协议错误、空 content 均失败</text>
  <path d="M430 1084 H650" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="528" y="1100" width="244" height="74" rx="14" fill="#F0FDFA" stroke="#99F6E4"/><text x="650" y="1130" text-anchor="middle" class="h" font-size="16" font-weight="700">AI_CALL_SUCCEEDED / FAILED</text><text x="650" y="1156" text-anchor="middle" class="s" font-size="13">call_id、时延、状态、usage（若 Provider 提供）</text>
  <path d="M650 1174 V1222 H210" stroke="#059669" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <g><circle cx="112" cy="1230" r="17" fill="#059669"/><text x="112" y="1236" text-anchor="middle" class="n" font-size="14">5</text><text x="145" y="1236" class="t" font-size="15">返回 utf8mb4 文本或 SQL 错误</text></g>

  <rect x="70" y="1350" width="860" height="216" rx="24" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="104" y="1395" class="h" font-size="20" font-weight="700">关键边界：哪些情况不会产生 MaaS 调用？</text>
  <text x="104" y="1430" class="t" font-size="16">参数 / options / AI_INVOKE / Profile / credential / STARTED 审计失败 → 本地返回失败。</text>
  <text x="104" y="1464" class="t" font-size="16">连接中断、总超时或事务回滚发生在出站后时，MaaS 可能已接收请求并产生费用。</text>
  <text x="104" y="1498" class="t" font-size="16">管理员关闭 ai_invoke_audit 时没有 STARTED/终态审计；这是显式的高风险运维变更。</text>
  <text x="104" y="1534" class="s" font-size="14">RAG 的检索、tenant/标签过滤和来源保留在调用方 SQL；服务端不验证来源真实性。</text>
</svg>
