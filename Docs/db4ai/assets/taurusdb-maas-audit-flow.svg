<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">Two phase AI audit flow</title><desc id="d">Started is persisted before egress and terminal state is appended after the request.</desc><defs><style>.h{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#102A43}.t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#243B53}.k{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#2563EB"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#DC2626"/></marker></defs><rect width="1000" height="500" fill="#F8FAFC"/><text x="64" y="66" class="h" font-size="29" font-weight="700">两阶段审计：先落盘，再出站</text><text x="64" y="96" class="t" font-size="16">审计开启时，STARTED 无法安全落盘即 fail closed；终态失败保留 STARTED 并按 UNKNOWN 处置。</text><g><rect x="70" y="170" width="190" height="105" rx="16" fill="#2563EB"/><text x="165" y="210" text-anchor="middle" class="k" font-size="18" font-weight="700">本地校验</text><text x="165" y="237" text-anchor="middle" class="k" font-size="14">参数 · 权限 · Profile</text></g><g><rect x="400" y="155" width="210" height="135" rx="16" fill="#0F766E"/><text x="505" y="198" text-anchor="middle" class="k" font-size="18" font-weight="700">AI_CALL_STARTED</text><text x="505" y="225" text-anchor="middle" class="k" font-size="14">审计文件 append + fsync</text><text x="505" y="249" text-anchor="middle" class="k" font-size="14">生成 call_id</text></g><g><rect x="740" y="170" width="190" height="105" rx="16" fill="#2563EB"/><text x="835" y="210" text-anchor="middle" class="k" font-size="18" font-weight="700">MaaS HTTPS</text><text x="835" y="237" text-anchor="middle" class="k" font-size="14">请求、响应或失败</text></g><path d="M260 222H400" stroke="#2563EB" stroke-width="4" marker-end="url(#a)"/><path d="M610 222H740" stroke="#2563EB" stroke-width="4" marker-end="url(#a)"/><path d="M835 275V345H505V290" stroke="#0F766E" stroke-width="4" fill="none" marker-end="url(#a)"/><g><rect x="400" y="345" width="210" height="86" rx="16" fill="#047857"/><text x="505" y="380" text-anchor="middle" class="k" font-size="17" font-weight="700">terminal append</text><text x="505" y="406" text-anchor="middle" class="k" font-size="14">SUCCEEDED / FAILED</text></g><path d="M505 290V345" stroke="#0F766E" stroke-width="4" marker-end="url(#a)"/><path d="M505 155V125H270" stroke="#DC2626" stroke-width="3" fill="none" marker-end="url(#r)"/><text x="75" y="135" class="t" font-size="14" fill="#DC2626">STARTED 写入失败：本地拒绝，不发送 MaaS 请求</text></svg>
